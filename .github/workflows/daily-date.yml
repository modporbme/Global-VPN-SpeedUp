name: Daily Date Update

on:
  schedule:
    - cron: "22 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update date and toggle blank line
        run: |
          python3 << 'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os, re

          target = "readme.md"
          if not os.path.isfile(target):
              print("cwd:", os.getcwd())
              print("files:", os.listdir("."))
              raise SystemExit(f"{target} is not a file")

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          compact = now.strftime("%Y%m%d")

          with open(target, "r", encoding="utf-8") as f:
              original = f.read()

          text = re.sub(
              r"(最近测速时间为：)\s*\d{8}",
              r"\g<1>" + compact,
              original,
              count=1,
          )

          lines = text.splitlines()
          idx = next((i for i, ln in enumerate(lines) if "最近测速时间为：" in ln), None)
          if idx is None:
              raise SystemExit("未找到：最近测速时间为：")

          # 固定位置：测速日期的下一行
          # 有空行就删一行；没有空行就加一行（这次不删）
          if idx + 1 < len(lines) and lines[idx + 1].strip() == "":
              del lines[idx + 1]
              action = "deleted blank line"
          else:
              lines.insert(idx + 1, "")
              action = "added blank line"

          text2 = "\n".join(lines)
          if original.endswith("\n"):
              text2 += "\n"

          with open(target, "w", encoding="utf-8") as f:
              f.write(text2)

          print("date:", compact)
          print("pad:", action)
          PY

      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add readme.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: 更新测速日期"
            git push
          fi
